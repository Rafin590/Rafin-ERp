<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStore ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b1120; font-family: system-ui, sans-serif; }
    .sidebar-bg { background-color: #080d1a; }
  </style>
</head>
<body class="flex min-h-screen text-slate-300">

  <!-- Sidebar -->
  <aside class="w-64 sidebar-bg border-r border-slate-800 p-4 flex flex-col justify-between h-screen overflow-y-auto">
    <div>
      <!-- Brand Header -->
      <div class="flex items-center gap-3 px-2 py-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-lg">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-white font-bold text-base leading-none">OmniStore</h1>
            <span class="bg-indigo-900/60 text-indigo-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-indigo-700">ERP</span>
          </div>
          <p class="text-xs text-slate-500 mt-1">Fashion Hub BD</p>
        </div>
      </div>

      <!-- Menu Items -->
      <nav class="space-y-1 text-sm">
        
        <!-- Live DB -->
        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-table-cells text-emerald-400"></i>
            <span class="font-medium text-slate-200">Google Sheets</span>
          </div>
          <span class="bg-emerald-950 text-emerald-400 text-[11px] font-semibold px-2 py-0.5 rounded border border-emerald-800">Live DB</span>
        </div>

        <!-- Couriers -->
        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-truck-fast text-emerald-400"></i>
            <span>Steadfast Courier</span>
          </div>
          <span class="bg-emerald-950 text-emerald-400 text-[11px] px-2 py-0.5 rounded border border-emerald-800">Live API</span>
        </div>

        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-motorcycle text-pink-500"></i>
            <span>Pathao Courier</span>
          </div>
          <span class="bg-pink-950 text-pink-400 text-[11px] px-2 py-0.5 rounded border border-pink-800">v2 Token</span>
        </div>

        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-box text-red-500"></i>
            <span>RedX Logistics</span>
          </div>
          <span class="bg-red-950 text-red-400 text-[11px] px-2 py-0.5 rounded border border-red-800">API</span>
        </div>

        <!-- Finance Section Header -->
        <p class="text-[11px] font-bold tracking-wider text-slate-500 uppercase mt-6 mb-2 px-2">Finance & P&L</p>

        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-wallet text-indigo-400"></i>
            <span>Accounts & Wallets</span>
          </div>
          <span class="text-xs text-slate-400" id="walletCount">5 Wallets</span>
        </div>

        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-chart-line text-emerald-400"></i>
            <span>Profit & Loss (P&L)</span>
          </div>
          <span class="bg-emerald-950 text-emerald-400 text-[11px] px-2 py-0.5 rounded border border-emerald-800">ROI</span>
        </div>

        <!-- Management Section Header -->
        <p class="text-[11px] font-bold tracking-wider text-slate-500 uppercase mt-6 mb-2 px-2">Management & System</p>

        <div class="flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/50 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-user-gear text-amber-400"></i>
            <span>Staff & Permissions</span>
          </div>
          <span class="text-amber-400 font-bold text-xs">RBAC</span>
        </div>
      </nav>
    </div>

    <!-- User Profile Footer -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-800 px-2">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-indigo-600 font-bold text-white flex items-center justify-center">A</div>
        <div>
          <p class="text-xs font-bold text-white">admin</p>
          <p class="text-[11px] text-indigo-400">Super Admin</p>
        </div>
      </div>
      <button class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-8 bg-[#0d1527]">
    <div class="border border-dashed border-slate-800 rounded-xl h-full flex items-center justify-center text-slate-500">
      Dashboard Content Area
    </div>
  </main>

  <script>
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    async function loadData() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSummary`);
        const json = await res.json();
        if(json.status === "success") {
          document.getElementById("walletCount").innerText = `${json.data.activeWallets} Wallets`;
        }
      } catch (err) {
        console.error("Data fetch failed:", err);
      }
    }

    // loadData(); // Web App URL বসানোর পর এটি আনকমেন্ট করুন
  </script>
</body>
</html>
