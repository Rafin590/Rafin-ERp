<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStore ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b1120; font-family: system-ui, sans-serif; }
    .sidebar-bg { background-color: #080d1a; }
    .active-nav { background-color: rgba(30, 41, 59, 0.9); border-left: 3px solid #6366f1; }
  </style>
</head>
<body class="flex h-screen text-slate-300 overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 sidebar-bg border-r border-slate-800 p-4 flex flex-col justify-between h-full overflow-y-auto shrink-0">
    <div>
      <!-- Brand -->
      <div class="flex items-center gap-3 px-2 py-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-lg">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-white font-bold text-base leading-none">OmniStore</h1>
            <span class="bg-indigo-900/60 text-indigo-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-indigo-700">ERP</span>
          </div>
          <p class="text-xs text-slate-500 mt-1">Fashion Hub BD</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="space-y-1 text-sm select-none">
        
        <!-- Live DB / Overview -->
        <div onclick="switchTab('overview')" id="nav-overview" class="nav-item flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/60 cursor-pointer active-nav">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-table-cells text-emerald-400"></i>
            <span class="font-medium text-slate-200">Google Sheets</span>
          </div>
          <span class="bg-emerald-950 text-emerald-400 text-[11px] font-semibold px-2 py-0.5 rounded border border-emerald-800">Live DB</span>
        </div>

        <!-- Courier Section -->
        <div onclick="switchTab('couriers')" id="nav-couriers" class="nav-item flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/60 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-truck-fast text-emerald-400"></i>
            <span>Couriers Panel</span>
          </div>
          <span class="bg-indigo-950 text-indigo-400 text-[11px] px-2 py-0.5 rounded border border-indigo-800">Multi API</span>
        </div>

        <!-- Finance Section Header -->
        <p class="text-[11px] font-bold tracking-wider text-slate-500 uppercase mt-6 mb-2 px-2">Finance & P&L</p>

        <div onclick="switchTab('accounts')" id="nav-accounts" class="nav-item flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/60 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-wallet text-indigo-400"></i>
            <span>Accounts & Wallets</span>
          </div>
          <span class="text-xs text-slate-400" id="walletCountBadge">Loading...</span>
        </div>

        <div onclick="switchTab('pnl')" id="nav-pnl" class="nav-item flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/60 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-chart-line text-emerald-400"></i>
            <span>Profit & Loss</span>
          </div>
          <span class="bg-emerald-950 text-emerald-400 text-[11px] px-2 py-0.5 rounded border border-emerald-800">ROI</span>
        </div>

        <!-- Management Section Header -->
        <p class="text-[11px] font-bold tracking-wider text-slate-500 uppercase mt-6 mb-2 px-2">Management & System</p>

        <div onclick="switchTab('staff')" id="nav-staff" class="nav-item flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-800/60 cursor-pointer">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-user-gear text-amber-400"></i>
            <span>Staff & Permissions</span>
          </div>
          <span class="text-amber-400 font-bold text-xs">RBAC</span>
        </div>
      </nav>
    </div>

    <!-- User Profile Footer -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-800 px-2">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-indigo-600 font-bold text-white flex items-center justify-center">A</div>
        <div>
          <p class="text-xs font-bold text-white">admin</p>
          <p class="text-[11px] text-indigo-400">Super Admin</p>
        </div>
      </div>
      <button class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-8 bg-[#0d1527] overflow-y-auto">
    <div id="content-container" class="max-w-6xl mx-auto space-y-6">
      <!-- Dynamic Views Render Here -->
    </div>
  </main>

  <script>
    // আপনার ডিপ্লয় করা Google Apps Script Web App URL এখানে বসান
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const views = {
      overview: `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">Live Data Overview</h2>
            <button onclick="refreshData()" class="bg-indigo-600 hover:bg-indigo-700 text-xs text-white px-3 py-2 rounded-lg flex items-center gap-2">
              <i class="fa-solid fa-rotate"></i> Sync Data
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-slate-400 font-medium">Total Orders</p>
              <h3 class="text-2xl font-bold text-white mt-2" id="kpi-orders">...</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-emerald-400 font-medium">Delivered Parcels</p>
              <h3 class="text-2xl font-bold text-emerald-400 mt-2" id="kpi-delivered">...</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-amber-400 font-medium">In-Transit</p>
              <h3 class="text-2xl font-bold text-amber-400 mt-2" id="kpi-intransit">...</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-red-400 font-medium">Returned</p>
              <h3 class="text-2xl font-bold text-red-400 mt-2" id="kpi-returned">...</h3>
            </div>
          </div>
        </div>
      `,
      couriers: `
        <div class="space-y-6">
          <h2 class="text-xl font-bold text-white">Connected Courier Channels</h2>
          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-800/60 text-slate-400 border-b border-slate-800">
                <tr>
                  <th class="p-4">Courier Name</th>
                  <th class="p-4">Status</th>
                  <th class="p-4">Parcels Today</th>
                  <th class="p-4">COD Pending</th>
                </tr>
              </thead>
              <tbody id="courier-table-body" class="divide-y divide-slate-800 text-slate-300">
                <tr><td colspan="4" class="p-4 text-center">Loading courier data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `,
      accounts: `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-white">Accounts & Digital Wallets</h2>
            <button class="bg-emerald-600 hover:bg-emerald-700 text-xs text-white px-3 py-2 rounded-lg">+ Add Account</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="accounts-grid">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">Loading accounts...</div>
          </div>
        </div>
      `,
      pnl: `
        <div class="space-y-6">
          <h2 class="text-xl font-bold text-white">Profit & Loss Summary</h2>
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl text-center text-slate-400">
            <p>P&L breakdown analytics will render based on your Sheets expense log.</p>
          </div>
        </div>
      `,
      staff: `
        <div class="space-y-6">
          <h2 class="text-xl font-bold text-white">Staff Management & RBAC</h2>
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl text-center text-slate-400">
            <p>Access control rules and user permission management interface.</p>
          </div>
        </div>
      `
    };

    function switchTab(tabKey) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-nav'));
      const activeEl = document.getElementById(`nav-${tabKey}`);
      if (activeEl) activeEl.classList.add('active-nav');

      const container = document.getElementById('content-container');
      container.innerHTML = views[tabKey] || '<div class="text-white">Not found</div>';

      if (tabKey === 'overview') fetchOverviewData();
      if (tabKey === 'couriers') fetchCourierData();
      if (tabKey === 'accounts') fetchAccountData();
    }

    async function fetchOverviewData() {
      try {
        const res = await fetch(`${API_URL}?action=getOverview`);
        const json = await res.json();
        if (json.success) {
          document.getElementById('kpi-orders').innerText = json.data.totalOrders;
          document.getElementById('kpi-delivered').innerText = json.data.delivered;
          document.getElementById('kpi-intransit').innerText = json.data.inTransit;
          document.getElementById('kpi-returned').innerText = json.data.returned;
          document.getElementById('walletCountBadge').innerText = `${json.data.activeWallets} Wallets`;
        }
      } catch (e) {
        // Fallback demo values if URL is not configured
        document.getElementById('kpi-orders').innerText = "1,240";
        document.getElementById('kpi-delivered').innerText = "1,080";
        document.getElementById('kpi-intransit').innerText = "110";
        document.getElementById('kpi-returned').innerText = "50";
        document.getElementById('walletCountBadge').innerText = "5 Wallets";
      }
    }

    async function fetchCourierData() {
      try {
        const res = await fetch(`${API_URL}?action=getCouriers`);
        const json = await res.json();
        const tbody = document.getElementById('courier-table-body');
        if (json.success && tbody) {
          tbody.innerHTML = json.data.map(c => `
            <tr>
              <td class="p-4 font-semibold text-white">${c.name}</td>
              <td class="p-4"><span class="bg-emerald-950 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-800">${c.status}</span></td>
              <td class="p-4">${c.parcelsToday}</td>
              <td class="p-4 font-mono font-bold">৳${c.codPending.toLocaleString()}</td>
            </tr>
          `).join('');
        }
      } catch (e) {
        console.warn("API Offline, displaying local dummy state.");
      }
    }

    async function fetchAccountData() {
      try {
        const res = await fetch(`${API_URL}?action=getAccounts`);
        const json = await res.json();
        const grid = document.getElementById('accounts-grid');
        if (json.success && grid) {
          grid.innerHTML = json.data.map(acc => `
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-slate-400 uppercase font-semibold">${acc.type}</p>
              <h4 class="text-lg font-bold text-white mt-1">${acc.name}</h4>
              <p class="text-2xl font-bold text-emerald-400 mt-3">৳${acc.balance.toLocaleString()}</p>
            </div>
          `).join('');
        }
      } catch (e) {
        console.warn("API Offline, displaying local dummy state.");
      }
    }

    // Initial Load
    switchTab('overview');
  </script>
</body>
</html>
