    function switchTab(tabKey) {
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('sidebar-active'));

      if (activeBtn) activeBtn.classList.add('sidebar-active');

      const container = document.getElementById('content-container');
      container.innerHTML = Views[tabKey] || '<div class="p-8 text-center text-slate-400">মডিউল প্রস্তুত হচ্ছে...</div>';

      if (tabKey === 'dashboard') initChart();
    }

    function showGenericModule(name) {
      const container = document.getElementById('content-container');
      container.innerHTML = `

          </div>
        </div>
      `;
    }

    function handleSearch(query) {
      const activeView = document.getElementById('modules-grid');
      if (activeView) {
        const cards = activeView.querySelectorAll('.feature-card');
        let count = 0;
        cards.forEach(card => {
          const match = card.innerText.toLowerCase().includes(query.toLowerCase());
          card.style.display = match ? 'block' : 'none';
          if (match) count++;
        });
        const counter = document.getElementById('card-counter');
        if (counter) counter.innerText = `${count} টি মডিউল উপলব্ধ`;
      }
    }

    function initChart() {
      const ctx = document.getElementById('salesChart');
      if (!ctx) return;
      new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
          labels: ['১৪ আগস্ট', '১৫ আগস্ট', '১৬ আগস্ট', '১৭ আগস্ট', '১৮ আগস্ট', '১৯ আগস্ট (আজ)'],
