<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStore ERP Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b1120; font-family: system-ui, sans-serif; }
    .sidebar-bg { background-color: #080d1a; }
    .active-nav { background-color: rgba(30, 41, 59, 0.9); border-left: 3px solid #6366f1; }
  </style>
</head>
<body class="flex h-screen text-slate-300 overflow-hidden">

  <!-- Sidebar Navigation -->
  <aside class="w-64 sidebar-bg border-r border-slate-800 p-4 flex flex-col justify-between h-full overflow-y-auto shrink-0 select-none">
    <div>
      <div class="flex items-center gap-3 px-2 py-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-lg">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div>
          <h1 class="text-white font-bold text-base leading-none">OmniStore</h1>
          <p class="text-xs text-slate-500 mt-1">Fashion Hub BD</p>
        </div>
      </div>

      <nav class="space-y-1 text-sm">
        <div onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer active-nav">
          <div class="flex items-center gap-3"><i class="fa-solid fa-chart-pie text-indigo-400"></i><span>Dashboard</span></div>
        </div>

        <div onclick="switchTab('orders')" id="nav-orders" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer">
          <div class="flex items-center gap-3"><i class="fa-solid fa-cart-shopping text-emerald-400"></i><span>Order Manager</span></div>
          <span class="bg-emerald-950 text-emerald-400 text-[10px] px-2 py-0.5 rounded border border-emerald-800">Live</span>
        </div>

        <div onclick="switchTab('products')" id="nav-products" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer">
          <div class="flex items-center gap-3"><i class="fa-solid fa-layer-group text-sky-400"></i><span>Products & Stock</span></div>
        </div>

        <div onclick="switchTab('courier')" id="nav-courier" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer">
          <div class="flex items-center gap-3"><i class="fa-solid fa-truck-fast text-amber-400"></i><span>Courier API Hub</span></div>
          <span class="bg-amber-950 text-amber-400 text-[10px] px-2 py-0.5 rounded border border-amber-800">Auto</span>
        </div>

        <div onclick="switchTab('accounting')" id="nav-accounting" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer">
          <div class="flex items-center gap-3"><i class="fa-solid fa-calculator text-rose-400"></i><span>Accounting & P&L</span></div>
        </div>

        <div onclick="switchTab('customers')" id="nav-customers" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer">
          <div class="flex items-center gap-3"><i class="fa-solid fa-users text-cyan-400"></i><span>Customers CRM</span></div>
        </div>

        <div onclick="switchTab('landing')" id="nav-landing" class="nav-item flex items-center justify-between p-2.5 rounded-lg cursor-pointer">
          <div class="flex items-center gap-3"><i class="fa-solid fa-globe text-purple-400"></i><span>Landing Page Form</span></div>
        </div>
      </nav>
    </div>

    <div class="pt-4 border-t border-slate-800 px-2 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-indigo-600 font-bold text-white flex items-center justify-center">A</div>
        <p class="text-xs font-bold text-white leading-none">Super Admin</p>
      </div>
      <i class="fa-solid fa-arrow-right-from-bracket text-slate-400 cursor-pointer"></i>
    </div>
  </aside>

  <!-- Main View Container -->
  <main class="flex-1 p-8 bg-[#0d1527] overflow-y-auto">
    <div id="app-viewport" class="max-w-6xl mx-auto"></div>
  </main>

  <script>
    const GAS_ENDPOINT = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const Templates = {
      dashboard: `
        <div class="space-y-6">
          <h2 class="text-xl font-bold text-white">Business Performance Overview</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-slate-400 font-semibold uppercase">Today's Sales</p>
              <h3 class="text-2xl font-bold text-emerald-400 mt-2" id="kpi-daily">৳ 0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-slate-400 font-semibold uppercase">Monthly Turnover</p>
              <h3 class="text-2xl font-bold text-indigo-400 mt-2" id="kpi-monthly">৳ 0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <p class="text-xs text-slate-400 font-semibold uppercase">Total Orders</p>
              <h3 class="text-2xl font-bold text-white mt-2" id="kpi-total">0</h3>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl border-l-4 border-l-amber-500">
              <p class="text-xs text-slate-400 font-semibold">Pending Approval</p>
              <h4 class="text-xl font-bold text-white mt-1" id="kpi-pending">0</h4>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl border-l-4 border-l-emerald-500">
              <p class="text-xs text-slate-400 font-semibold">Delivered Orders</p>
              <h4 class="text-xl font-bold text-white mt-1" id="kpi-delivered">0</h4>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl border-l-4 border-l-rose-500">
              <p class="text-xs text-slate-400 font-semibold">Return Ratio</p>
              <h4 class="text-xl font-bold text-white mt-1" id="kpi-returned">0</h4>
            </div>
          </div>
        </div>
      `,
      orders: `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-white">Order Management</h2>
            <input type="text" placeholder="Search orders..." class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300">
              <thead class="bg-slate-800/60 border-b border-slate-800 text-slate-400">
                <tr>
                  <th class="p-3">Order ID</th>
                  <th class="p-3">Customer</th>
                  <th class="p-3">Phone</th>
                  <th class="p-3">Product</th>
                  <th class="p-3">COD</th>
                  <th class="p-3">Status</th>
                  <th class="p-3">Action</th>
                </tr>
              </thead>
              <tbody id="order-rows" class="divide-y divide-slate-800">
                <tr><td colspan="7" class="p-4 text-center">Loading orders from Google Sheets...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `,
      landing: `
        <div class="max-w-lg mx-auto bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
          <h3 class="text-lg font-bold text-white border-b border-slate-800 pb-3">Product Landing Page Order Form</h3>
          <div>
            <label class="text-xs text-slate-400">Customer Name</label>
            <input id="form-name" type="text" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-400">Mobile Number</label>
            <input id="form-phone" type="text" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-400">Delivery Address</label>
            <textarea id="form-address" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white mt-1"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-slate-400">Select Product</label>
              <select id="form-product" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white mt-1">
                <option value="Premium Shirt">Premium Shirt (৳1,250)</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-400">Quantity</label>
              <input id="form-qty" type="number" value="1" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white mt-1">
            </div>
          </div>
          <button onclick="submitLandingOrder()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-lg mt-2">Place Order Now</button>
        </div>
      `,
      courier: `
        <div class="space-y-6">
          <h2 class="text-xl font-bold text-white">Courier Integration Hub</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <h4 class="font-bold text-white">Steadfast Courier</h4>
              <p class="text-xs text-slate-400 mt-1">One-click auto parcel booking directly synced with consignment tracking.</p>
              <span class="inline-block bg-emerald-950 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-800 mt-3">API Live</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
              <h4 class="font-bold text-white">Pathao Courier</h4>
              <p class="text-xs text-slate-400 mt-1">Token-based bulk parcel assignment and delivery status update.</p>
              <span class="inline-block bg-pink-950 text-pink-400 text-xs px-2 py-0.5 rounded border border-pink-800 mt-3">Token Configured</span>
            </div>
          </div>
        </div>
      `
    };

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-nav'));
      const activeEl = document.getElementById(`nav-${tab}`);
      if(activeEl) activeEl.classList.add('active-nav');

      document.getElementById('app-viewport').innerHTML = Templates[tab] || `<div class="text-slate-500">Module under development.</div>`;

      if (tab === 'dashboard') loadDashboardStats();
      if (tab === 'orders') loadOrders();
    }

    async function loadDashboardStats() {
      try {
        const res = await fetch(`${GAS_ENDPOINT}?action=getDashboardData`);
        const json = await res.json();
        if(json.success) {
          document.getElementById('kpi-daily').innerText = `৳ ${json.data.dailySale.toLocaleString()}`;
          document.getElementById('kpi-monthly').innerText = `৳ ${json.data.monthlySale.toLocaleString()}`;
          document.getElementById('kpi-total').innerText = json.data.totalOrders;
          document.getElementById('kpi-pending').innerText = json.data.pending;
          document.getElementById('kpi-delivered').innerText = json.data.delivered;
          document.getElementById('kpi-returned').innerText = json.data.returned;
        }
      } catch (e) {
        console.warn("GAS Endpoint connection error");
      }
    }

    async function submitLandingOrder() {
      const orderPayload = {
        action: "createOrder",
        name: document.getElementById('form-name').value,
        phone: document.getElementById('form-phone').value,
        address: document.getElementById('form-address').value,
        product: document.getElementById('form-product').value,
        qty: document.getElementById('form-qty').value,
        total: 1250,
        advance: 0,
        cod: 1250
      };

      const res = await fetch(GAS_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify(orderPayload)
      });
      const data = await res.json();
      if(data.success) {
        alert("Order Placed Successfully! Order ID: " + data.orderId);
      }
    }

    // Default Load
    switchTab('dashboard');
  </script>
</body>
</html>
